<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MQTT WebSocket Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>MQTT WebSocket Dashboard</h1>

    <div id="status">Not Connected</div>

    <div class="card">
      <div class="card-header">MQTT Config</div>
      <div class="card-content active">
        <select id="protocol">
          <option value="wss">wss</option>
          <option value="ws">ws</option>
        </select>
        <input id="broker" value="broker.emqx.io" />
        <input id="port" value="8084" />
        <input id="path" value="/mqtt" />
        <button id="connectBtn">Connect</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Subscribe</div>
      <div class="card-content">
        <input id="subtopic" placeholder="example/topic" />
        <button id="subscribeBtn">Subscribe</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Publish</div>
      <div class="card-content">
        <input id="pubtopic" placeholder="example/topic" />
        <input id="message" placeholder="hello mqtt" />
        <button id="publishBtn">Send</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Messages</div>
      <div class="card-content active">
        <button id="clearBtn">Clear Messages</button>
        <div id="messages">Waiting data...</div>
      </div>
    </div>
    <div class="wrapper">
      <a href="../">Main Page</a>
      <a href="https://github.com/vorkey/websocket-mqtt-client" target="_blank">Repository on Github</a>
    </div>
    <script src="script.js"></script>
  </body>
</html>
